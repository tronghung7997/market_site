# Server: read stdout of the app containers straight from Docker.
# Names are prefixes; compose v1 uses `_`, v2 uses `-` (project = folder name,
# /srv/market_site → market_site). Postgres/Redis are left out on purpose.
data_dir: /var/lib/vector
sources:
  app_logs:
    type: docker_logs
    include_containers:
      - market_site-marketplace-svc
      - market_site_marketplace-svc
      - market_site-frontend
      - market_site_frontend
    # Stack traces printed by Next.js / uvicorn span many stdout lines. Glue
    # indented, `}`/`]` and `[cause]` continuation lines onto the line that
    # started them, so one error is one row instead of a dozen "}" rows.
    multiline:
      mode: continue_through
      start_pattern: '^[^\s}\]]'
      condition_pattern: '^(\s|[}\]])'
      timeout_ms: 1000

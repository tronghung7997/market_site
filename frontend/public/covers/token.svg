<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tokBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="tokShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#D97706" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="tokBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#tokBg)" filter="url(#tokShadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#tokBevel)"/>
  
  <!-- 3D Gold Token / Key Emblem -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.4"/>
  <circle cx="256" cy="256" r="110" fill="url(#coinGold)"/>
  
  <!-- Key / Digital Token Crest inside Coin -->
  <circle cx="256" cy="216" r="32" fill="none" stroke="#B45309" stroke-width="14"/>
  <path d="M256 248v68m-16-24h32m-16 16h24" stroke="#B45309" stroke-width="14" stroke-linecap="round"/>
</svg>

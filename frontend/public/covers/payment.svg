<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="payBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="payShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#047857" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="payBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#payBg)" filter="url(#payShadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#payBevel)"/>
  
  <!-- Credit Card / Fintech Security Shield Glyph -->
  <rect x="116" y="166" width="280" height="180" rx="28" fill="#FFFFFF"/>
  <rect x="116" y="206" width="280" height="36" fill="#1F2937"/>
  <rect x="156" y="270" width="56" height="42" rx="8" fill="url(#chipGold)"/>
  <circle cx="340" cy="290" r="18" fill="#EF4444" opacity="0.85"/>
  <circle cx="360" cy="290" r="18" fill="#F59E0B" opacity="0.85"/>
</svg>

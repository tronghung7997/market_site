[project]
name = "marketplace-svc"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.16.0",
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "structlog>=25.0.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "redis[hiredis]>=5.0.0",
    "email-validator>=2.0.0",
    "cryptography>=50.0.0",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "no_db: test is isolated from marketplace persistence and skips the autouse database cleanup",
]
